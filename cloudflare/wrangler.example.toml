name = "easybosnian-daily-tifah-v1"
main = "worker.mjs"
compatibility_date = "2026-10-02"
workers_dev = true

[ai]
binding = "AI"

[vars]
PROJECT_ID = "tifahefendijam-easybosnian-daily-uploads-v1"
GITHUB_REPOSITORY = "TifahEfendijaM/easybosnian-daily-uploads"
PREPARATION_DISPATCH_ENABLED = "true"

[[d1_databases]]
binding = "DB"
database_name = "easybosnian-daily-tifah-v1"
database_id = "REPLACE_WITH_NEW_DATABASE_ID"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "IMAGES"
id = "REPLACE_WITH_NEW_NAMESPACE_ID"

[triggers]
# Start at 05:00 Sarajevo in either season; local-time gating selects one hour.
# Existing reporting remains at 06:59 Sarajevo and never retries a dispatch.
crons = ["0 3,4 * * *", "59 4 * * *", "59 5 * * *"]

[observability]
enabled = true

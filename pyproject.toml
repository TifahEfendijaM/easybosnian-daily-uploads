[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "easybosnian-daily-uploads"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["Pillow==12.1.0", "jsonschema==4.26.0", "certifi>=2025.10.5,<2027"]

[project.scripts]
easybosnian = "easybosnian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

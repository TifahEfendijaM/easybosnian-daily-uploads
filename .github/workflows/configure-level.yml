name: Legacy EasyBosnian difficulty (inactive)
run-name: EasyBosnian difficulty → ${{ inputs.level }}
on:
  workflow_dispatch:
    inputs:
      level:
        description: 'INACTIVE legacy setting. Current preparations use the publishing workflow difficulty selector.'
        type: choice
        options: [Keep current, A1, A2, B1, B2, C1, C2]
        default: Keep current
permissions:
  contents: read
concurrency:
  group: easybosnian-preparation-level-settings
  cancel-in-progress: false
jobs:
  configure:
    # Retained for a possible return to persistent difficulty; deliberately inactive.
    if: ${{ false && github.repository == 'TifahEfendijaM/easybosnian-daily-uploads' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Save and read back the shared difficulty only
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_LEVEL: ${{ inputs.level }}
        run: easybosnian set-level --level "$TARGET_LEVEL"

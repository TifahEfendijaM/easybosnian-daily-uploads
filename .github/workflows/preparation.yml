name: EasyBosnian cloud ChatGPT preparation
on:
  schedule:
    - cron: '7 5 * * *'
      timezone: Europe/Sarajevo
  workflow_dispatch:
    inputs:
      mode:
        description: Verify connections only, or deliberately recover today's batch and publication
        type: choice
        options: [verify, recover_today]
        default: verify
permissions:
  contents: write
  issues: write
concurrency:
  group: easybosnian-cloud-chatgpt-single-session
  cancel-in-progress: false
jobs:
  preparation:
    if: github.repository == 'TifahEfendijaM/easybosnian-daily-uploads' && (github.event_name == 'workflow_dispatch' || (vars.CLOUD_PREPARATION_ENABLED == 'true' && github.event_name == 'schedule'))
    # Pin the research host rather than inheriting changes to Linux sandbox support.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      batch_date: ${{ steps.handoff.outputs.batch_date }}
      package_hash: ${{ steps.handoff.outputs.package_hash }}
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project and pinned official Codex CLI
        run: |
          python -m pip install -e .
          npm install --global @openai/codex@0.160.0
      - name: Restore dedicated managed ChatGPT sign-in privately
        id: auth
        env:
          EASYBOSNIAN_CODEX_DIR: ${{ runner.temp }}/easybosnian-cloud-codex
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: python -m easybosnian.cloud_prepare bootstrap
      - name: Verify cloud connection or prepare today's scheduled batch
        env:
          EASYBOSNIAN_CODEX_DIR: ${{ runner.temp }}/easybosnian-cloud-codex
          EASYBOSNIAN_WORKER_URL: ${{ secrets.EASYBOSNIAN_WORKER_URL }}
          EASYBOSNIAN_ADMIN_TOKEN: ${{ secrets.EASYBOSNIAN_ADMIN_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_TOKEN_ISSUED_AT: ${{ secrets.INSTAGRAM_TOKEN_ISSUED_AT }}
          META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          HC_PREPARATION_URL: ${{ secrets.HC_PREPARATION_URL }}
          DAILY_POSTING_ENABLED: ${{ vars.DAILY_POSTING_ENABLED }}
          PREPARATION_MODE: ${{ (github.event_name == 'schedule' || inputs.mode == 'recover_today') && 'prepare' || 'verify' }}
        run: python -m easybosnian.cloud_prepare "$PREPARATION_MODE"
      - name: Persist refreshed ChatGPT sign-in for the next run
        if: always() && steps.auth.outcome == 'success'
        env:
          EASYBOSNIAN_CODEX_DIR: ${{ runner.temp }}/easybosnian-cloud-codex
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: python -m easybosnian.cloud_prepare persist
      - name: Record preparation result
        if: always()
        run: |
          if [ -f build/preparation-result.json ]; then
            cat build/preparation-result.json >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f build/failure.txt ]; then
            cat build/failure.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve safe private result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easybosnian-preparation-${{ github.run_id }}
          path: |
            build/preparation-result.json
            build/failure.txt
          retention-days: 7
          if-no-files-found: ignore
      - name: Approve the verified daily batch for automatic handoff
        id: handoff
        if: success() && (github.event_name == 'schedule' || inputs.mode == 'recover_today')
        env:
          PREPARATION_RECOVERY_AUTHORIZED: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'recover_today' }}
        run: python -m easybosnian.handoff
  publication:
    needs: preparation
    if: github.repository == 'TifahEfendijaM/easybosnian-daily-uploads' && (github.event_name == 'schedule' || inputs.mode == 'recover_today') && vars.DAILY_POSTING_ENABLED == 'true' && needs.preparation.outputs.batch_date != ''
    uses: ./.github/workflows/daily.yml
    with:
      batch_date: ${{ needs.preparation.outputs.batch_date }}
      package_hash: ${{ needs.preparation.outputs.package_hash }}
      mode: live
    secrets: inherit

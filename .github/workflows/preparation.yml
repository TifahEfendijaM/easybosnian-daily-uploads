name: EasyBosnian daily preparation and publishing
run-name: EasyBosnian (${{ inputs.mode }})
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Start here: daily = publish; preview = render without posting; verify = connection check only'
        type: choice
        options: [verify, preview, daily]
        default: verify
      content_selection:
        description: 'Daily choice: same_words = redo content for same words; same_theme = new words; new = all new; custom = edit fields below'
        type: choice
        options: [same_words, same_theme, new, custom]
        default: new
      custom_theme:
        description: 'Custom only: if left empty, the theme from the selected saved batch remains'
        type: string
        default: ''
      custom_word_1_action:
        description: 'CUSTOM ONLY - Pitanje dana: keep_today = keep word; chatgpt = choose word; entered = use typed word'
        type: choice
        options: [keep_today, chatgpt, entered]
        default: keep_today
      custom_word_1:
        description: 'Custom only: Pitanje dana word; fill only when its action is entered'
        type: string
        default: ''
      custom_word_2_action:
        description: 'CUSTOM ONLY - Znaš li: keep_today = keep topic; chatgpt = choose topic; entered = use typed word/topic'
        type: choice
        options: [keep_today, chatgpt, entered]
        default: keep_today
      custom_word_2:
        description: 'Custom only: Znaš li word, comparison (peći / kuhati), or short topic; fill only when action is entered'
        type: string
        default: ''
      custom_word_3_action:
        description: 'CUSTOM ONLY - Riječ dana: keep_today = keep word; chatgpt = choose word; entered = use typed word'
        type: choice
        options: [keep_today, chatgpt, entered]
        default: keep_today
      custom_word_3:
        description: 'Custom only: Riječ dana word; fill only when its action is entered'
        type: string
        default: ''
      batch_target:
        description: 'latest = replace latest batch; none = add a post; all_today = clean ALL earlier batches from today (Sarajevo)'
        type: choice
        options: [latest, none, all_today]
        default: latest
permissions:
  actions: read
  contents: read
  issues: write
concurrency:
  group: easybosnian-cloud-chatgpt-single-session
  cancel-in-progress: false
jobs:
  run:
    if: github.repository == 'TifahEfendijaM/easybosnian-daily-uploads'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CONTENT_SELECTION: ${{ inputs.content_selection || 'new' }}
      BATCH_TARGET: ${{ inputs.batch_target || 'latest' }}
      CUSTOM_THEME: ${{ inputs.custom_theme }}
      CUSTOM_WORD_1: ${{ inputs.custom_word_1 }}
      CUSTOM_WORD_2: ${{ inputs.custom_word_2 }}
      CUSTOM_WORD_3: ${{ inputs.custom_word_3 }}
      CUSTOM_WORD_1_ACTION: ${{ inputs.custom_word_1_action }}
      CUSTOM_WORD_2_ACTION: ${{ inputs.custom_word_2_action }}
      CUSTOM_WORD_3_ACTION: ${{ inputs.custom_word_3_action }}
      INSTAGRAM_DELETE_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_DELETE_ACCESS_TOKEN }}
      INSTAGRAM_DELETE_USER_ID: ${{ secrets.INSTAGRAM_DELETE_USER_ID }}
      INSTAGRAM_FACEBOOK_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_FACEBOOK_ACCESS_TOKEN }}
      INSTAGRAM_FACEBOOK_USER_ID: ${{ secrets.INSTAGRAM_FACEBOOK_USER_ID }}
      INSTAGRAM_FACEBOOK_EXPIRES_AT: ${{ secrets.INSTAGRAM_FACEBOOK_EXPIRES_AT }}
      DAILY_POSTING_ENABLED: ${{ vars.DAILY_POSTING_ENABLED }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      EASYBOSNIAN_WORKER_URL: ${{ secrets.EASYBOSNIAN_WORKER_URL }}
      EASYBOSNIAN_ADMIN_TOKEN: ${{ secrets.EASYBOSNIAN_ADMIN_TOKEN }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_TOKEN_ISSUED_AT: ${{ secrets.INSTAGRAM_TOKEN_ISSUED_AT }}
      META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
      GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
      FACEBOOK_POSTING_ENABLED: ${{ vars.FACEBOOK_POSTING_ENABLED }}
      FACEBOOK_STORIES_ENABLED: ${{ vars.FACEBOOK_STORIES_ENABLED }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      TIKTOK_POSTING_ENABLED: ${{ vars.TIKTOK_POSTING_ENABLED }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_TIKTOK_CHANNEL_ID: ${{ vars.BUFFER_TIKTOK_CHANNEL_ID }}
      BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
      INSTAGRAM_STORIES_ENABLED: ${{ vars.INSTAGRAM_STORIES_ENABLED }}
    steps:
      - id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project and pinned official Codex CLI
        id: install
        run: |
          python -m pip install -e .
          npm install --global @openai/codex@0.160.0
      - name: Restore dedicated ChatGPT sign-in privately
        id: auth
        env:
          EASYBOSNIAN_CODEX_DIR: ${{ runner.temp }}/easybosnian-cloud-codex
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: python -m easybosnian.cloud_prepare bootstrap
      - name: Verify connections or stage reviewed content privately
        id: preparation
        env:
          EASYBOSNIAN_CODEX_DIR: ${{ runner.temp }}/easybosnian-cloud-codex
          MODE: ${{ inputs.mode }}
        run: python -m easybosnian.cloud_prepare "$MODE"
      - name: Read only recorded Meta publication capabilities
        if: inputs.mode == 'verify'
        run: python scripts/diagnose_publications.py
      - name: Generate backgrounds and visually place feed text privately
        id: artwork
        if: success() && inputs.mode != 'verify'
        env:
          EASYBOSNIAN_CODEX_DIR: ${{ runner.temp }}/easybosnian-cloud-codex
          MODE: ${{ inputs.mode }}
        run: python -m easybosnian.visual_placement
      - name: Persist refreshed cloud sign-in privately
        id: persist
        if: always() && steps.auth.outcome == 'success'
        env:
          EASYBOSNIAN_CODEX_DIR: ${{ runner.temp }}/easybosnian-cloud-codex
        run: python -m easybosnian.cloud_prepare persist
      - name: Use prepared cards and publish only in daily mode
        id: publication
        if: success() && inputs.mode != 'verify'
        env:
          MODE: ${{ inputs.mode }}
          EASYBOSNIAN_PREPARED_ARTWORK: 'true'
        run: easybosnian run --mode "$MODE" --prepared
      - name: Report otherwise unhandled workflow failure
        if: failure()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          PREPARATION_OUTCOME: ${{ steps.preparation.outcome }}
          ARTWORK_OUTCOME: ${{ steps.artwork.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
          PUBLICATION_OUTCOME: ${{ steps.publication.outcome }}
        run: python scripts/workflow_failure.py
      - name: Write safe results
        if: always()
        run: python scripts/action_summary.py
      - name: Prepare private successful-publication report
        id: report
        if: success() && inputs.mode == 'daily' && steps.publication.outcome == 'success'
        continue-on-error: true
        run: python -m easybosnian.success_report build
      - name: Preserve cards and safe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easybosnian-${{ inputs.mode }}-${{ github.run_id }}
          retention-days: 7
          path: |
            build/*/*-card.jpg
            build/*/*-story.jpg
            build/*/*result.json
            build/preparation-result.json
            build/failure.txt
            build/*/success-report.*
          if-no-files-found: ignore

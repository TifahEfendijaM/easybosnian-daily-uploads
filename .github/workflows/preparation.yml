name: EasyBosnian daily preparation and publishing
run-name: EasyBosnian (${{ inputs.mode }})
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify connections, render a saved preview, or prepare and publish fresh daily content
        type: choice
        options: [verify, preview, daily]
        default: verify
      content_selection:
        description: Daily rerun content (reuse requires today's saved content; all choices create fresh text and images)
        type: choice
        options: [new, same_theme, same_words]
        default: new
      tiktok_previous_removed:
        description: I manually deleted today's previous TikTok post before this daily rerun
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
concurrency:
  group: easybosnian-cloud-chatgpt-single-session
  cancel-in-progress: false
jobs:
  run:
    if: github.repository == 'TifahEfendijaM/easybosnian-daily-uploads'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CONTENT_SELECTION: ${{ inputs.content_selection || 'new' }}
      TIKTOK_PREVIOUS_REMOVED: ${{ inputs.tiktok_previous_removed }}
      INSTAGRAM_DELETE_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_DELETE_ACCESS_TOKEN }}
      INSTAGRAM_DELETE_USER_ID: ${{ secrets.INSTAGRAM_DELETE_USER_ID }}
      DAILY_POSTING_ENABLED: ${{ vars.DAILY_POSTING_ENABLED }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      EASYBOSNIAN_WORKER_URL: ${{ secrets.EASYBOSNIAN_WORKER_URL }}
      EASYBOSNIAN_ADMIN_TOKEN: ${{ secrets.EASYBOSNIAN_ADMIN_TOKEN }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_TOKEN_ISSUED_AT: ${{ secrets.INSTAGRAM_TOKEN_ISSUED_AT }}
      META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
      GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
      FACEBOOK_POSTING_ENABLED: ${{ vars.FACEBOOK_POSTING_ENABLED }}
      FACEBOOK_STORIES_ENABLED: ${{ vars.FACEBOOK_STORIES_ENABLED }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      TIKTOK_POSTING_ENABLED: ${{ vars.TIKTOK_POSTING_ENABLED }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_TIKTOK_CHANNEL_ID: ${{ vars.BUFFER_TIKTOK_CHANNEL_ID }}
      BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
      INSTAGRAM_STORIES_ENABLED: ${{ vars.INSTAGRAM_STORIES_ENABLED }}
    steps:
      - id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project and pinned official Codex CLI
        id: install
        run: |
          python -m pip install -e .
          npm install --global @openai/codex@0.160.0
      - name: Restore dedicated ChatGPT sign-in privately
        id: auth
        env:
          EASYBOSNIAN_CODEX_DIR: ${{ runner.temp }}/easybosnian-cloud-codex
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: python -m easybosnian.cloud_prepare bootstrap
      - name: Verify connections or prepare reviewed content in history
        id: preparation
        env:
          EASYBOSNIAN_CODEX_DIR: ${{ runner.temp }}/easybosnian-cloud-codex
          MODE: ${{ inputs.mode }}
        run: python -m easybosnian.cloud_prepare "$MODE"
      - name: Persist refreshed cloud sign-in privately
        id: persist
        if: always() && steps.auth.outcome == 'success'
        env:
          EASYBOSNIAN_CODEX_DIR: ${{ runner.temp }}/easybosnian-cloud-codex
        run: python -m easybosnian.cloud_prepare persist
      - name: Render today's history row and publish only in daily mode
        id: publication
        if: success() && inputs.mode != 'verify'
        env:
          MODE: ${{ inputs.mode }}
        run: easybosnian run --mode "$MODE"
      - name: Inspect Facebook cleanup identities without deleting or publishing
        if: success() && inputs.mode == 'verify'
        run: python scripts/inspect_facebook_cleanup.py
      - name: Report otherwise unhandled workflow failure
        if: failure()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          PREPARATION_OUTCOME: ${{ steps.preparation.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
          PUBLICATION_OUTCOME: ${{ steps.publication.outcome }}
        run: python scripts/workflow_failure.py
      - name: Write safe results
        if: always()
        run: python scripts/action_summary.py
      - name: Preserve cards and safe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easybosnian-${{ inputs.mode }}-${{ github.run_id }}
          retention-days: 7
          path: |
            build/*/*-card.jpg
            build/*/*-story.jpg
            build/*/*result.json
            build/preparation-result.json
            build/failure.txt
          if-no-files-found: ignore

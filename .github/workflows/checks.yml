name: Validate EasyBosnian code and renderer
on:
  push:
    branches: [main]
    paths-ignore: ['queue/**']
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    if: github.repository == 'TifahEfendijaM/easybosnian-daily-uploads'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: node --test cloudflare/worker.test.mjs
      - name: Verify deployed infrastructure and Instagram credentials without publishing
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          EASYBOSNIAN_WORKER_URL: ${{ secrets.EASYBOSNIAN_WORKER_URL }}
          EASYBOSNIAN_ADMIN_TOKEN: ${{ secrets.EASYBOSNIAN_ADMIN_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_TOKEN_ISSUED_AT: ${{ secrets.INSTAGRAM_TOKEN_ISSUED_AT }}
          META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: easybosnian check-infrastructure

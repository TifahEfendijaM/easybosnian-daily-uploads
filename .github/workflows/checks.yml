name: Validate EasyBosnian code and renderer
on:
  push:
    branches: [main]
    paths-ignore: ['queue/**']
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    if: github.repository == 'TifahEfendijaM/easybosnian-daily-uploads'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: node --test cloudflare/worker.test.mjs


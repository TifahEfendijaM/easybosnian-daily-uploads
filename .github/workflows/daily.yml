name: EasyBosnian daily publishing and exports
on:
  workflow_call:
    inputs:
      batch_date:
        description: Exact reviewed Sarajevo batch date from successful preparation
        required: true
        type: string
      package_hash:
        description: Immutable package hash verified by the preparation wrapper
        required: true
        type: string
      mode:
        description: Mode for the explicitly authorized handoff
        type: string
        default: live
  workflow_dispatch:
    inputs:
      mode:
        description: Publish the daily batch, render an optional preview, or reconcile publication
        type: choice
        options: [preview, live, reconcile]
        default: preview
      batch_date:
        description: Sarajevo date YYYY-MM-DD; blank uses today
        type: string
        default: ''
permissions:
  contents: read
  issues: write
concurrency:
  group: easybosnian-instagram-single-publisher
  cancel-in-progress: false
jobs:
  pipeline:
    if: github.repository == 'TifahEfendijaM/easybosnian-daily-uploads' && (github.event_name == 'workflow_dispatch' || (vars.DAILY_POSTING_ENABLED == 'true' && github.event_name == 'schedule' && github.event.schedule == '0 5 * * *' && inputs.package_hash != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      EASYBOSNIAN_WORKER_URL: ${{ secrets.EASYBOSNIAN_WORKER_URL }}
      EASYBOSNIAN_ADMIN_TOKEN: ${{ secrets.EASYBOSNIAN_ADMIN_TOKEN }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_TOKEN_ISSUED_AT: ${{ secrets.INSTAGRAM_TOKEN_ISSUED_AT }}
      META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_POSTING_ENABLED: ${{ vars.FACEBOOK_POSTING_ENABLED }}
      TIKTOK_EXPORT_ENABLED: ${{ vars.TIKTOK_EXPORT_ENABLED }}
      INSTAGRAM_STORIES_ENABLED: ${{ vars.INSTAGRAM_STORIES_ENABLED }}
      GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
      HC_PIPELINE_URL: ${{ secrets.HC_PIPELINE_URL }}
      BATCH_DATE: ${{ inputs.batch_date }}
      EXPECTED_PACKAGE_HASH: ${{ inputs.package_hash }}
      RUN_MODE: ${{ inputs.mode || 'live' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The reviewed queue commit is newer than the preparation's starting SHA.
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: python -m pip install -e .
      - name: Validate, generate, render and run selected mode
        run: |
          if [ -n "$BATCH_DATE" ]; then
            easybosnian daily --mode "$RUN_MODE" --date "$BATCH_DATE"
          else
            easybosnian daily --mode "$RUN_MODE"
          fi
      - name: Record actual result
        if: always()
        run: python scripts/action_summary.py
      - name: Preserve private diagnostics and preview cards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easybosnian-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/*/result.json
            build/*/*-result.json
            build/*/*-card.jpg
            build/*/*-tiktok.jpg
            build/*/*-story.jpg
            build/*/tiktok-caption.txt
            build/failure.txt
          retention-days: 7
          if-no-files-found: warn

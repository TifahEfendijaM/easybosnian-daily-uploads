name: EasyBosnian daily Instagram pipeline
on:
  schedule:
    - cron: '30 19 * * *'
      timezone: Europe/Sarajevo
  workflow_dispatch:
    inputs:
      mode:
        description: Publish the daily batch, render an optional preview, or reconcile publication
        type: choice
        options: [preview, live, reconcile]
        default: preview
      batch_date:
        description: Sarajevo date YYYY-MM-DD; blank uses today
        type: string
        default: ''
permissions:
  contents: read
  issues: write
concurrency:
  group: easybosnian-instagram-single-publisher
  cancel-in-progress: false
jobs:
  pipeline:
    if: github.repository == 'TifahEfendijaM/easybosnian-daily-uploads' && (github.event_name == 'workflow_dispatch' || (vars.DAILY_POSTING_ENABLED == 'true' && github.event.schedule == '30 19 * * *'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      EASYBOSNIAN_WORKER_URL: ${{ secrets.EASYBOSNIAN_WORKER_URL }}
      EASYBOSNIAN_ADMIN_TOKEN: ${{ secrets.EASYBOSNIAN_ADMIN_TOKEN }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_TOKEN_ISSUED_AT: ${{ secrets.INSTAGRAM_TOKEN_ISSUED_AT }}
      META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
      GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
      HC_PIPELINE_URL: ${{ secrets.HC_PIPELINE_URL }}
      BATCH_DATE: ${{ inputs.batch_date }}
      RUN_MODE: ${{ inputs.mode || 'live' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: python -m pip install -e .
      - name: Validate, generate, render and run selected mode
        run: |
          if [ -n "$BATCH_DATE" ]; then
            easybosnian pipeline --mode "$RUN_MODE" --date "$BATCH_DATE"
          else
            easybosnian pipeline --mode "$RUN_MODE"
          fi
      - name: Record actual result
        if: always()
        run: python scripts/action_summary.py
      - name: Preserve private diagnostics and preview cards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easybosnian-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/*/result.json
            build/*/*-card.jpg
            build/failure.txt
          retention-days: 7
          if-no-files-found: warn
